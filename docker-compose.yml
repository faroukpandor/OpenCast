services:
  opencast:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/opencast.sqlite
      # This compose file binds to loopback for local HTTP. Override both for HTTPS deployment.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - opencast_data:/app/data
    stop_grace_period: 15s
volumes:
  opencast_data:

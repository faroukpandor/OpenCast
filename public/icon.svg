<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer subtle tech border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" opacity="0.4" />

  <!-- Hardware TV Display Shell -->
  <rect x="96" y="110" width="320" height="220" rx="24" fill="#1e293b" stroke="#475569" stroke-width="8" />

  <!-- Inner Display Active Surface -->
  <rect x="116" y="130" width="280" height="180" rx="14" fill="#090d16" />

  <!-- Stand / Base -->
  <path d="M216 338 L296 338 L320 390 L192 390 Z" fill="#334155" />
  <rect x="160" y="390" width="192" height="14" rx="7" fill="#475569" />

  <!-- Terminal / ADB Prompt Graphic inside screen -->
  <path d="M148 185 L180 215 L148 245" fill="none" stroke="url(#glow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="195" y1="245" x2="235" y2="245" stroke="#10b981" stroke-width="10" stroke-linecap="round" />

  <!-- High-Tech Wireless / Broadcast Waves (Top-Right) -->
  <path d="M300 175 A 50 50 0 0 1 340 215" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <path d="M315 155 A 80 80 0 0 1 370 215" fill="none" stroke="#60a5fa" stroke-width="7" stroke-linecap="round" opacity="0.6" />
  <circle cx="280" cy="215" r="8" fill="#3b82f6" />
</svg>
